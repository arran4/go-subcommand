# Agent rules for generation:
# https://arran4.github.io/blog/post/2026/043-canonical-github-actions-ci-cd-super-reference/
# Built using these posts as reference/guidance.
name: CI/CD

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
    branches: [main, master]
  workflow_dispatch:
    inputs:
      mode:
        description: "Pipeline mode"
        required: true
        default: "lint-fix"
        type: choice
        options:
          - lint-fix
          - build
          - release-major
          - release-minor
          - release-patch
          - release-test
          - release-rc
          - release-alpha
          - monthly-maintenance
          - publish-tag
      release_version_override:
        description: "Optional explicit release version (for example 2.4.0 or 2.4.0-rc.2)"
        required: false
        default: ""
        type: string
      allow_prs:
        description: "Allow automation to open pull requests"
        required: false
        default: true
        type: boolean
  schedule:
    - cron: '17 3 1 * *'
    - cron: '41 2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.event.inputs.mode, 'release-') }}

permissions:
  contents: read

jobs:
  route:
    name: Route event
    runs-on: ubuntu-latest
    outputs:
      run_code_checks: ${{ steps.route.outputs.run_code_checks }}
      run_build: ${{ steps.route.outputs.run_build }}
      run_release: ${{ steps.route.outputs.run_release }}
      run_autofix: ${{ steps.route.outputs.run_autofix }}
      run_publisher: ${{ steps.route.outputs.run_publisher }}
      run_maintenance: ${{ steps.route.outputs.run_maintenance }}
      mode: ${{ steps.route.outputs.mode }}
      run_pages: ${{ steps.route.outputs.run_pages }}
    steps:
      - id: route
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          run_code_checks=true
          run_build=true
          run_release=false
          run_autofix=false
          run_publisher=false
          run_maintenance=false
          run_pages=false
          mode="build"

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            # PRs just validate
            :
          elif [[ "$EVENT_NAME" == "schedule" ]]; then
            if [[ "${{ github.event.schedule }}" == "17 3 1 * *" ]]; then
               run_maintenance=true
               mode="monthly-maintenance"
            else
               run_autofix=true
               mode="lint-fix"
            fi
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            mode="${INPUT_MODE:-build}"
            if [[ "$mode" == "lint-fix" ]]; then
               run_autofix=true
            elif [[ "$mode" == "publish-tag" ]]; then
               # The internal explicit publish-tag dispatch mode
               if [[ "$REF_TYPE" == "tag" && "$GITHUB_REF" == refs/tags/v* ]]; then
                  run_code_checks=false
                  run_build=false
                  run_publisher=true
               else
                  echo "Error: publish-tag mode requires a v* tag context. Found: $GITHUB_REF" >&2
                  sh -c "exit 1"
               fi
            elif [[ "$mode" == release-* ]]; then
               run_release=true
            elif [[ "$mode" == "monthly-maintenance" ]]; then
               run_maintenance=true
            fi
          elif [[ "$EVENT_NAME" == "push" && "$REF_TYPE" == "tag" && "$GITHUB_REF" == refs/tags/v* ]]; then
             # Standard external v* push publication
             run_publisher=true
          fi

          if [[ "$GITHUB_REF" == refs/tags/* || "$GITHUB_REF" == "refs/heads/main" || "$GITHUB_REF" == "refs/heads/master" ]]; then
            run_pages=true
          fi

          echo "run_code_checks=$run_code_checks" >> "$GITHUB_OUTPUT"
          echo "run_build=$run_build" >> "$GITHUB_OUTPUT"
          echo "run_release=$run_release" >> "$GITHUB_OUTPUT"
          echo "run_autofix=$run_autofix" >> "$GITHUB_OUTPUT"
          echo "run_publisher=$run_publisher" >> "$GITHUB_OUTPUT"
          echo "run_maintenance=$run_maintenance" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "run_pages=$run_pages" >> "$GITHUB_OUTPUT"

  prepare-release-tag:
    name: Prepare release tag
    needs: [route]
    if: ${{ needs.route.outputs.run_release == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
      next_version: ${{ steps.tag.outputs.next_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup git-tag-inc
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'publish-tag' }}
        uses: arran4/git-tag-inc-action@v1
        with:
          mode: install
      - id: tag
        shell: bash
        run: |
          set -euo pipefail

          MODE="${{ inputs.mode }}"
          OVERRIDE="${{ inputs.release_version_override }}"

          git fetch --tags --force

          if [[ -n "$OVERRIDE" ]]; then
            OVERRIDE="${OVERRIDE#v}"
            next_tag="v$OVERRIDE"
          else
            case "$MODE" in
              release-major) level="major"; suffix="" ;;
              release-minor) level="minor"; suffix="" ;;
              release-patch) level="patch"; suffix="" ;;
              release-test)  level="patch"; suffix="test" ;;
              release-rc)    level="patch"; suffix="rc" ;;
              release-alpha) level="patch"; suffix="alpha" ;;
              *) echo "Unsupported release mode: $MODE" >&2; exit 1 ;;
            esac

            args=(-print-version-only "$level")
            [[ -n "$suffix" ]] && args+=("$suffix")
            next_tag=$(git-tag-inc "${args[@]}")
          fi

          [[ "$next_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]] || {
            echo "Invalid tag: $next_tag" >&2
            exit 1
          }

          if git rev-parse "$next_tag" >/dev/null 2>&1; then
            # Safe recovery semantics: verify existing tag against remote
            REMOTE_TAG_SHA=$(git ls-remote --tags origin "refs/tags/$next_tag" | awk '{print $1}')
            if [[ "$REMOTE_TAG_SHA" == "${GITHUB_SHA}" ]]; then
              echo "Tag $next_tag exists and points to GITHUB_SHA. Safe to retry."
            else
              echo "Tag already exists and points to $REMOTE_TAG_SHA (expected ${GITHUB_SHA}): $next_tag" >&2
              echo "To retry a failed publication for this exact version, ensure release_version_override is used and GITHUB_SHA matches." >&2
              exit 1
            fi
          fi

          echo "release_tag=$next_tag" >> "$GITHUB_OUTPUT"

          clean_tag="${next_tag#v}"
          clean_tag="${clean_tag%%-*}"
          IFS='.' read -r maj min pat <<< "$clean_tag"
          echo "next_version=${maj:-0}.${min:-0}.$(( ${pat:-0} + 1 ))-SNAPSHOT" >> "$GITHUB_OUTPUT"

  hugo-build:
    name: Build Hugo site
    needs: [route]
    if: ${{ needs.route.outputs.run_pages == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build with Hugo
        working-directory: ./docs
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/public

  hugo-deploy:
    name: Deploy to GitHub Pages
    needs: [route, hugo-build]
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')) && needs.route.outputs.run_pages == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: ${{ github.event_name != 'pull_request' && 'github-pages' || '' }}
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  golangci:
    name: lint
    needs: [route]
    if: ${{ needs.route.outputs.run_code_checks == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          install-mode: goinstall

  go-test:
    name: Go lint/test (${{ matrix.os }})
    needs: [route, golangci]
    if: ${{ needs.route.outputs.run_code_checks == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./... -v

  go-vet:
    name: Go vet
    needs: [route]
    if: ${{ needs.route.outputs.run_code_checks == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...

  maintenance:
    name: Monthly Maintenance
    needs: [route]
    if: ${{ needs.route.outputs.run_maintenance == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go get -u ./... && go mod tidy
      - name: Create Pull Request
        if: ${{ github.event_name == 'schedule' || inputs.allow_prs != false }}
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: monthly dependency update"
          title: "chore: monthly dependency update"
          branch: automation/maintenance
          delete-branch: true

  autofix:
    name: Autofix Formatting
    needs: [route]
    if: ${{ needs.route.outputs.run_autofix == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run go fmt
        run: go fmt ./...
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      - name: Run golangci-lint fix
        run: $(go env GOPATH)/bin/golangci-lint run --fix
      - name: Create Pull Request
        if: ${{ github.event_name == 'schedule' || inputs.allow_prs != false }}
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "style: auto-format code and lint fixes"
          title: "style: auto-format code and lint fixes"
          body: "This PR auto-formats the code and applies lint fixes."
          branch: automation/lint-fix
          delete-branch: true
          base: main

  verify-generation:
    name: Verify Generated Code
    needs: [route]
    if: ${{ needs.route.outputs.run_code_checks == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run generation with --clean
        run: go run ./cmd/gosubc generate --clean --project-provenance=false --timestamp=false

      - name: Verify Examples (go run & test)
        run: |
          (cd examples/basic1 && go test ./...)
          (cd examples/complex && go test ./...)
          (cd examples/defaultexpr && go test ./...)
          (cd examples/returns && go test ./...)

      - name: Verify (Vet)
        run: |
          go vet .
          go vet ./cmd/gosubc
          go vet ./templates

          (cd examples/basic1 && go vet ./...)
          (cd examples/complex && go vet ./...)
          (cd examples/defaultexpr && go vet ./...)
          (cd examples/returns && go vet ./...)



      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          install-mode: goinstall

      - name: Check for changes
        id: check_changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "Changes detected"
            git status
            git diff
            echo "changes_detected=true" >> $GITHUB_OUTPUT
            # Fail on release modes or if PRs are not explicitly permitted
            if [[ "${{ needs.route.outputs.run_release }}" == "true" ]]; then
              echo "Generated code changes detected during a release path. Failing to prevent dirty tags."
              exit 1
            elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.allow_prs }}" == "true" ]]; then
              echo "Will create PR."
            else
              echo "Changes found but PR creation is not enabled. Failing workflow."
              exit 1
            fi
          else
            echo "No changes detected"
            echo "changes_detected=false" >> $GITHUB_OUTPUT
          fi

      - name: Determine PR attributes
        if: steps.check_changes.outputs.changes_detected == 'true'
        id: pr_attributes
        env:
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "base=$HEAD_REF" >> $GITHUB_OUTPUT
            echo "branch=update-generated-code-$HEAD_REF" >> $GITHUB_OUTPUT
            echo "title=chore: update generated code for $HEAD_REF" >> $GITHUB_OUTPUT
          else
            echo "base=$REF_NAME" >> $GITHUB_OUTPUT
            echo "branch=update-generated-code-$REF_NAME" >> $GITHUB_OUTPUT
            echo "title=chore: update generated code for $REF_NAME" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.check_changes.outputs.changes_detected == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update generated code"
          title: ${{ steps.pr_attributes.outputs.title }}
          body: "This PR updates the generated code to match the current generator logic."
          branch: ${{ steps.pr_attributes.outputs.branch }}
          delete-branch: true
          base: ${{ steps.pr_attributes.outputs.base }}

  integration-test:
    name: Run Integration Script
    needs: [route]
    if: ${{ needs.route.outputs.run_build == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build and Install gosubc
        run: go install ./cmd/gosubc

      - name: Run Integration Test
        run: |
          set -e

          # Verify installation
          if ! command -v gosubc &> /dev/null; then
              echo "Error: gosubc not installed or not in PATH"
              exit 1
          fi

          echo "gosubc installed successfully at $(which gosubc)"

          # Create a temporary directory for integration test
          TEMP_DIR=$(mktemp -d)
          trap 'rm -rf "$TEMP_DIR"' EXIT

          echo "Using temp dir: $TEMP_DIR"

          # Define module name
          MODULE_NAME="example.com/integrationtest"

          # Create go.mod
          cat <<EOF2 > "$TEMP_DIR/go.mod"
          module $MODULE_NAME

          go 1.25
          EOF2

          # Create pkg directory
          mkdir -p "$TEMP_DIR/pkg"

          # Create lib.go with a simple subcommand definition
          cat <<EOF2 > "$TEMP_DIR/pkg/lib.go"
          package pkg

          import "fmt"

          // Hello is a subcommand \`testapp hello\`
          // Flags:
          //
          //	name: --name -n (default: "World") Name to greet
          func Hello(name string) {
              fmt.Printf("Hello, %s!\n", name)
          }
          EOF2

          # Switch to temp dir to avoid path issues with go build
          cd "$TEMP_DIR"

          # Run gosubc generate
          echo "Running gosubc generate..."
          gosubc generate

          # Verify generated code
          if [ ! -d "cmd/testapp" ]; then
              echo "Error: Generated cmd directory not found!"
              exit 1
          fi

          # Run the generated app using go run
          echo "Running generated app..."
          OUTPUT=$(go run ./cmd/testapp hello --name "Integration")
          EXPECTED="Hello, Integration!"

          if [ "$OUTPUT" != "$EXPECTED" ]; then
              echo "Error: Unexpected output. Expected '$EXPECTED', got '$OUTPUT'"
              exit 1
          fi

          echo "Integration test passed!"

  release-validation:
    name: Release Validation Gate
    needs: [route, prepare-release-tag, golangci, go-test, go-vet, verify-generation, integration-test]
    if: |
      !failure() && !cancelled() &&
      needs.route.outputs.run_release == 'true' &&
      needs.prepare-release-tag.result == 'success' &&
      needs.golangci.result == 'success' &&
      needs.go-test.result == 'success' &&
      needs.go-vet.result == 'success' &&
      needs.verify-generation.result == 'success' &&
      needs.integration-test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - run: echo "All required language checks passed."

  release-context:
    name: Release Context
    needs: [route, prepare-release-tag, release-validation]
    if: ${{ !failure() && !cancelled() && needs.route.outputs.run_release == 'true' && needs.release-validation.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    outputs:
      release_tag: ${{ steps.export.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize and push tag
        id: export
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="${{ needs.prepare-release-tag.outputs.release_tag }}"
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"

          git fetch --tags --force
          REMOTE_TAG_SHA=$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')

          if [[ -n "$REMOTE_TAG_SHA" ]]; then
            if [[ "$REMOTE_TAG_SHA" == "${GITHUB_SHA}" ]]; then
              echo "Tag $TAG already exists on remote and points to the correct SHA. Continuing safely."
            else
              echo "Tag $TAG already exists on remote but points to a different commit ($REMOTE_TAG_SHA). Failing." >&2
              exit 1
            fi
          else
            git tag "$TAG" "${GITHUB_SHA}"
            git push origin "$TAG" || (
              VERIFY_SHA=$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')
              if [[ "$VERIFY_SHA" == "${GITHUB_SHA}" ]]; then
                echo "Tag successfully verified on remote after push error."
              else
                echo "Tag push failed and remote verification failed." >&2
                exit 1
              fi
            )
          fi

          # Explicitly dispatch the publisher workflow at the new tag ref
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            gh workflow run "ci.yml" --ref "$TAG" -f mode="publish-tag"
          fi

  goreleaser:
    name: GoReleaser
    needs: [route]
    if: ${{ !failure() && !cancelled() && needs.route.outputs.run_publisher == 'true' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Determine GoReleaser Args
        id: args
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/*-test* || "$GITHUB_REF" == refs/tags/test-* ]]; then
             echo "args=release --snapshot --clean" >> "$GITHUB_OUTPUT"
          else
             echo "args=release --clean" >> "$GITHUB_OUTPUT"
          fi
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: ${{ steps.args.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }} # inject secrets.TAP_GITHUB_TOKEN
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
